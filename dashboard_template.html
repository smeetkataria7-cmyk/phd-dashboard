<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__ — Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#f4f6f9;--panel:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--accent:#2563eb;--accent-soft:#dbeafe;--good:#16a34a;--warn:#f59e0b}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1220;--panel:#121a2b;--ink:#e5e9f2;--mute:#94a3b8;--line:#243049;--accent:#60a5fa;--accent-soft:#1e3a5f}}
:root[data-theme=dark]{--bg:#0b1220;--panel:#121a2b;--ink:#e5e9f2;--mute:#94a3b8;--line:#243049;--accent:#60a5fa;--accent-soft:#1e3a5f}
:root[data-theme=light]{--bg:#f4f6f9;--panel:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--accent:#2563eb;--accent-soft:#dbeafe}
.heat td,.heat th{padding:4px 7px;text-align:center;font-size:11.5px}
.heat th:first-child,.heat td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);z-index:1}
.heat td.c{cursor:pointer;min-width:46px}
.heat td.c:hover{outline:2px solid var(--accent)}
.legend{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mute);margin:6px 0}
.legend i{display:inline-block;width:120px;height:8px;border-radius:4px;background:linear-gradient(90deg,rgba(220,38,38,.85),rgba(148,163,184,.12),rgba(37,99,235,.85))}
.top3{margin:0;padding-left:18px;font-size:12.5px}
.top3 li{margin:3px 0}
.pos{color:#2563eb}.neg{color:#dc2626}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{padding:18px 24px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{margin:0;font-size:20px}
.meta{color:var(--mute);font-size:12.5px;margin-top:2px}
.bar{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.tab{border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters label{font-size:12px;color:var(--mute)}
select,input[type=text],input[type=number]{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:13px}
button.btn{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:13px}
main{padding:18px 24px 40px;max-width:1500px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.card h3{margin:0 0 2px;font-size:14px}
.card .sub{margin:0 0 8px;color:var(--mute);font-size:12px}
.span2{grid-column:span 2}.span3{grid-column:1/-1}
@media(max-width:820px){.span2{grid-column:auto}}
.chartbox{position:relative;height:280px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .l{color:var(--mute);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:24px;font-weight:650;margin-top:2px}
.kpi .h{color:var(--mute);font-size:11.5px}
h2{font-size:15px;margin:22px 0 10px}
.tablewrap{overflow:auto;max-height:430px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:5px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);cursor:pointer;z-index:1}
tr:hover td{background:var(--accent-soft)}
.pager{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:12.5px;color:var(--mute)}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:10px}
.ctrl div{display:flex;flex-direction:column;gap:2px}.ctrl span{font-size:11px;color:var(--mute)}
.fillbar{height:6px;background:var(--line);border-radius:3px;width:70px;display:inline-block;vertical-align:middle}
.fillbar i{display:block;height:100%;background:var(--good);border-radius:3px}
.note{color:var(--mute);font-size:12px}
.pill{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:1px 8px;font-size:11px}
.empty{padding:40px;text-align:center;color:var(--mute)}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="meta" id="meta"></div>
</header>
<div class="bar">
  <div class="tabs" id="tabs"></div>
  <div class="filters" id="filters"></div>
  <button class="btn" id="themeBtn" title="Switch theme: Auto → Light → Dark" onclick="cycleTheme()"></button>
</div>
<main id="root"></main>

<script>
const D = __DATA_JSON__;
const S = D.sheets;
const PAL=['#2563eb','#16a34a','#f59e0b','#dc2626','#7c3aed','#0891b2','#db2777','#65a30d','#ea580c','#64748b'];
const root=document.getElementById('root');

/* ---------- helpers ---------- */
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k==='class')e.className=v; else if(k==='html')e.innerHTML=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v); else e.setAttribute(k,v);}
  for(const k of kids.flat()){ if(k==null)continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;};
const isNum=v=>typeof v==='number'&&isFinite(v);
const nums=a=>a.filter(isNum);
const mean=a=>{a=nums(a);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null};
const sum=a=>nums(a).reduce((x,y)=>x+y,0);
const fmt=(v,d=2)=>{ if(v==null||(typeof v==='number'&&!isFinite(v)))return '–';
  if(typeof v==='number'){ if(Math.abs(v)>=10000)return v.toLocaleString(undefined,{maximumFractionDigits:0}); return String(+v.toFixed(d)); }
  return String(v); };
const charts=[]; function mk(canvas,cfg){const c=new Chart(canvas,cfg);charts.push(c);return c;}
function clearCharts(){charts.splice(0).forEach(c=>c.destroy());}
const short=n=>n.replace(/^S\d+_?/,'').replace(/_/g,' ')||n;
const colNames=s=>s.cols.map(c=>c.name);
const colType=(s,n)=>(s.cols.find(c=>c.name===n)||{}).type;
const colFind=(s,re)=>colNames(s).find(n=>re.test(n));
const hasCols=(s,...ns)=>ns.every(n=>s.data[n]);

/* ---------- global filters ---------- */
const FILTER_COLS=['Variety Number','Season','Crop Plantation Type'];
const filters={};
function idxOf(s){
  const act=Object.entries(filters).filter(([c,v])=>v&&s.data[c]);
  const key=JSON.stringify(act);
  if(s._k===key)return s._i;
  const out=[];
  for(let i=0;i<s.nrows;i++){let ok=true;for(const [c,v] of act){if(s.data[c][i]!==v){ok=false;break;}} if(ok)out.push(i);}
  s._k=key;s._i=out;return out;
}
const vals=(s,c,idx)=>{const d=s.data[c];return idx.map(i=>d[i]);};
function buildFilters(){
  const box=document.getElementById('filters');box.innerHTML='';
  FILTER_COLS.forEach(c=>{
    const withCol=S.filter(s=>s.data[c]);
    if(withCol.length<2)return;
    const set=new Set();withCol.forEach(s=>s.data[c].forEach(v=>v!=null&&set.add(v)));
    if(set.size<2||set.size>60)return;
    const sel=el('select',{onchange:e=>{filters[c]=e.target.value;render();}},el('option',{value:''},'All'),
      ...[...set].sort().map(v=>el('option',{value:v},v)));
    box.append(el('label',{},c.replace(' Number','')+': '),sel);
  });
  box.append(el('button',{class:'btn',onclick:()=>{Object.keys(filters).forEach(k=>filters[k]='');buildFilters();render();}},'Reset'));
}

/* ---------- UI blocks ---------- */
function kpi(label,value,hint){return el('div',{class:'kpi'},el('div',{class:'l'},label),el('div',{class:'v'},value),hint?el('div',{class:'h'},hint):null);}
function card(title,sub,cls=''){const cv=el('canvas');const c=el('div',{class:'card '+cls},el('h3',{},title),sub?el('p',{class:'sub'},sub):null,el('div',{class:'chartbox'},cv));return {c,cv};}
const baseOpts=(extra={})=>Object.assign({responsive:true,maintainAspectRatio:false,animation:false,
  plugins:{legend:{labels:{boxWidth:12,color:getComputedStyle(document.body).color}}},
  scales:{x:{ticks:{color:'#94a3b8',maxRotation:60},grid:{color:'rgba(148,163,184,.15)'}},y:{ticks:{color:'#94a3b8'},grid:{color:'rgba(148,163,184,.15)'}}}},extra);
function groupAgg(keys,values,agg='mean'){
  const m=new Map();
  keys.forEach((k,i)=>{if(k==null)return;const v=values?values[i]:1;if(!m.has(k))m.set(k,[]);if(isNum(v)||!values)m.get(k).push(v);});
  const out=[];
  for(const [k,a] of m){let r;
    if(agg==='count')r=a.length; else if(agg==='sum')r=sum(a); else if(agg==='max')r=Math.max(...a); else if(agg==='min')r=Math.min(...a); else r=mean(a);
    out.push([k,r]);}
  return out;
}
const cmpMix=(a,b)=>(typeof a[0]==='number'&&typeof b[0]==='number')?a[0]-b[0]:String(a[0]).localeCompare(String(b[0]),undefined,{numeric:true});

/* ---------- Overview ---------- */
function overview(){
  const frag=[];
  const kp=el('div',{class:'kpis'});
  S.forEach(s=>{const idx=idxOf(s);const fill=s.cols.length?mean(s.cols.map(c=>c.filled))*100:0;
    kp.append(kpi(short(s.name),idx.length.toLocaleString(),`${s.cols.length} cols · ${fill.toFixed(0)}% filled`+(idx.length!==s.nrows?` · of ${s.nrows}`:'')));});
  frag.push(kp);

  const g=el('div',{class:'grid'});

  /* Field metadata */
  const fm=S.find(s=>hasCols(s,'Latitude','Longitude'));
  if(fm){
    const idx=idxOf(fm);
    const area=fm.data['Area (ha)']?sum(vals(fm,'Area (ha)',idx)):null;
    const vcol=fm.data['Variety Number']?'Variety Number':null;
    const fcol=colFind(fm,/^Field_ID$/i)||colFind(fm,/^Field$/i);
    const kk=el('div',{class:'kpis',style:'grid-column:1/-1;margin:0'});
    kk.append(kpi('Plots',idx.length),
      fcol?kpi('Fields',new Set(vals(fm,fcol,idx).filter(v=>v!=null)).size):null,
      vcol?kpi('Varieties',new Set(vals(fm,vcol,idx).filter(v=>v!=null)).size):null,
      area!=null?kpi('Total area (ha)',fmt(area,3)):null,
      fm.data['Harvest Age (Days)']?kpi('Avg harvest age',fmt(mean(vals(fm,'Harvest Age (Days)',idx)),0)+' d'):null);
    g.append(kk);
    const {c,cv}=card('Field locations','Longitude / latitude, bubble size = plot area'+(vcol?', colour = variety':''),'span2');
    g.append(c);
    const lat=vals(fm,'Latitude',idx),lon=vals(fm,'Longitude',idx),ar=fm.data['Area (ha)']?vals(fm,'Area (ha)',idx):[];
    const maxA=Math.max(...nums(ar),1e-9);
    const groups=new Map();
    idx.forEach((i,k)=>{if(!isNum(lat[k])||!isNum(lon[k]))return;const gk=vcol?(fm.data[vcol][i]||'n/a'):'plots';
      if(!groups.has(gk))groups.set(gk,[]);
      groups.get(gk).push({x:lon[k],y:lat[k],r:isNum(ar[k])?4+10*Math.sqrt(ar[k]/maxA):6});});
    mk(cv,{type:'bubble',data:{datasets:[...groups].map(([k,pts],j)=>({label:k,data:pts,backgroundColor:PAL[j%PAL.length]+'99',borderColor:PAL[j%PAL.length]}))},
      options:baseOpts({scales:{x:{title:{display:true,text:'Longitude',color:'#94a3b8'},ticks:{color:'#94a3b8'},grid:{color:'rgba(148,163,184,.15)'}},y:{title:{display:true,text:'Latitude',color:'#94a3b8'},ticks:{color:'#94a3b8'},grid:{color:'rgba(148,163,184,.15)'}}}})});
    if(vcol){
      const {c:c2,cv:cv2}=card('Plots per variety','Count of plots');
      g.append(c2);
      const a=groupAgg(vals(fm,vcol,idx),null,'count').sort((x,y)=>y[1]-x[1]);
      mk(cv2,{type:'bar',data:{labels:a.map(x=>x[0]),datasets:[{label:'Plots',data:a.map(x=>x[1]),backgroundColor:PAL[0]}]},options:baseOpts({indexAxis:'y',plugins:{legend:{display:false}}})});
    }
  }

  /* Ground-truth quality */
  const gt=S.find(s=>hasCols(s,'Brix','Pol')&&(s.data['CCS']||s.data['Purity']));
  if(gt){
    const idx=idxOf(gt);
    const kk=el('div',{class:'kpis',style:'grid-column:1/-1;margin:0'});
    ['Brix','Pol','CCS','Purity','Fiber'].filter(c=>gt.data[c]).forEach(c=>kk.append(kpi('Avg '+c,fmt(mean(vals(gt,c,idx))),'ground truth')));
    kk.append(kpi('Samples',idx.length));
    g.append(kk);
    const stageCol=gt.data['Crop_Stage']?'Crop_Stage':null;
    const dap=gt.data['Days After Planting (DAP)']?vals(gt,'Days After Planting (DAP)',idx):null;
    const metrics=['Brix','Pol','CCS'].filter(c=>gt.data[c]);
    if(stageCol){
      const keys=vals(gt,stageCol,idx);
      const order=new Map();
      if(dap)groupAgg(keys,dap,'mean').forEach(([k,v])=>order.set(k,v));
      const labels=[...new Set(keys.filter(Boolean))].sort((a,b)=>(order.get(a)??0)-(order.get(b)??0));
      const {c,cv}=card('Juice quality by crop stage','Average per stage (ordered by days after planting)');
      g.append(c);
      mk(cv,{type:'bar',data:{labels,datasets:metrics.map((m,j)=>({label:m,backgroundColor:PAL[j],data:labels.map(l=>{const a=groupAgg(keys,vals(gt,m,idx)).find(x=>x[0]===l);return a?a[1]:null;})}))},options:baseOpts()});
    }
    if(dap){
      const {c,cv}=card('Quality build-up vs days after planting','Mean per 20-day bin');
      g.append(c);
      const bins=d=>isNum(d)?Math.floor(d/20)*20:null;
      const ks=dap.map(bins);
      const labs=[...new Set(ks.filter(k=>k!=null))].sort((a,b)=>a-b);
      mk(cv,{type:'line',data:{labels:labs,datasets:metrics.map((m,j)=>({label:m,borderColor:PAL[j],backgroundColor:PAL[j],tension:.25,spanGaps:true,
        data:labs.map(l=>{const a=groupAgg(ks,vals(gt,m,idx)).find(x=>x[0]===l);return a?a[1]:null;})}))},options:baseOpts()});
    }
    if(gt.data['Variety Number']){
      const {c,cv}=card('Quality by variety','Average CCS / Brix per variety','span2');
      g.append(c);
      const keys=vals(gt,'Variety Number',idx);
      const labels=[...new Set(keys.filter(Boolean))].sort();
      const ms=['CCS','Brix'].filter(m=>gt.data[m]);
      mk(cv,{type:'bar',data:{labels,datasets:ms.map((m,j)=>({label:m,backgroundColor:PAL[j+2],data:labels.map(l=>{const a=groupAgg(keys,vals(gt,m,idx)).find(x=>x[0]===l);return a?a[1]:null;})}))},options:baseOpts()});
    }
  }

  /* Satellite indices */
  const sats=S.filter(s=>hasCols(s,'NDVI_Mean','Days After Planting (DAP)'));
  if(sats.length){
    const common=colNames(sats[0]).filter(n=>/_Mean$/.test(n)&&/(NDVI|EVI|SAVI|NDMI|NDRE|GNDVI|NDWI|MSAVI|OSAVI|CI_)/.test(n)&&sats.every(s=>s.data[n]));
    const {c,cv}=card('Vegetation index through the season','Mean per 20-day bin of days after planting, one line per satellite source','span2');
    const sel=el('select',{onchange:draw},...common.map(n=>el('option',{value:n},n)));
    c.insertBefore(el('div',{class:'ctrl'},el('div',{},el('span',{},'Index'),sel)),c.querySelector('.chartbox'));
    g.append(c);
    let ch;
    function draw(){
      if(ch){ch.destroy();charts.splice(charts.indexOf(ch),1);}
      const m=sel.value;const bins=d=>isNum(d)&&d>=0?Math.floor(d/20)*20:null;
      const labs=new Set();
      const series=sats.map((s,j)=>{const idx=idxOf(s);const ks=vals(s,'Days After Planting (DAP)',idx).map(bins);
        const a=groupAgg(ks,vals(s,m,idx));a.forEach(([k])=>labs.add(k));return {s,a:new Map(a),j};});
      const L=[...labs].sort((a,b)=>a-b);
      ch=mk(cv,{type:'line',data:{labels:L,datasets:series.map(({s,a,j})=>({label:short(s.name),borderColor:PAL[j],backgroundColor:PAL[j],tension:.25,spanGaps:true,pointRadius:2,data:L.map(l=>a.has(l)?a.get(l):null)}))},
        options:baseOpts({scales:{x:{title:{display:true,text:'Days after planting',color:'#94a3b8'},ticks:{color:'#94a3b8'},grid:{color:'rgba(148,163,184,.15)'}},y:{title:{display:true,text:m,color:'#94a3b8'},ticks:{color:'#94a3b8'},grid:{color:'rgba(148,163,184,.15)'}}}})});
    }
    draw();
    if(sats.every(s=>s.data['Crop_Stage'])){
      const {c:c2,cv:cv2}=card('NDVI by crop stage','Average NDVI per growth stage and satellite source');
      g.append(c2);
      const order=new Map();
      sats.forEach(s=>groupAgg(vals(s,'Crop_Stage',idxOf(s)),vals(s,'Days After Planting (DAP)',idxOf(s))).forEach(([k,v])=>order.set(k,((order.get(k)||v)+v)/2)));
      const labs=[...order.keys()].sort((a,b)=>order.get(a)-order.get(b));
      mk(cv2,{type:'bar',data:{labels:labs,datasets:sats.map((s,j)=>{const idx=idxOf(s);const a=new Map(groupAgg(vals(s,'Crop_Stage',idx),vals(s,'NDVI_Mean',idx)));
        return {label:short(s.name),backgroundColor:PAL[j],data:labs.map(l=>a.has(l)?a.get(l):null)};})},options:baseOpts()});
    }
  }

  /* Weather */
  const wx=S.find(s=>s.data['Average Rainfall_Daily']||s.data['Average Temperature_Max']);
  if(wx){
    const dcol=colFind(wx,/date/i)&&colType(wx,colFind(wx,/date/i))==='date'?colFind(wx,/date/i):wx.cols.find(c=>c.type==='date')?.name;
    const idx=idxOf(wx);
    const rain=wx.data['Average Rainfall_Daily']?vals(wx,'Average Rainfall_Daily',idx):null;
    const tmx=wx.data['Average Temperature_Max']?vals(wx,'Average Temperature_Max',idx):null;
    const tmn=wx.data['Average Temperature_Min']?vals(wx,'Average Temperature_Min',idx):null;
    const kk=el('div',{class:'kpis',style:'grid-column:1/-1;margin:0'});
    kk.append(kpi('Weather days',idx.length),
      rain?kpi('Total rainfall (avg src)',fmt(sum(rain),1)+' mm'):null,
      tmx?kpi('Avg Tmax',fmt(mean(tmx),1)+' °C'):null,
      tmn?kpi('Avg Tmin',fmt(mean(tmn),1)+' °C'):null,
      wx.data['Rain_Status']?kpi('Rainy days',vals(wx,'Rain_Status',idx).filter(v=>v&&!/no rain/i.test(v)).length):null);
    g.append(kk);
    if(dcol){
      const months=vals(wx,dcol,idx).map(d=>d?d.slice(0,7):null);
      const L=[...new Set(months.filter(Boolean))].sort();
      const {c,cv}=card('Monthly climate','Rainfall (bars, total mm) and temperature (lines, mean °C)','span2');
      g.append(c);
      const ds=[];
      if(rain){const a=new Map(groupAgg(months,rain,'sum'));ds.push({type:'bar',label:'Rainfall (mm)',yAxisID:'y',backgroundColor:'#60a5fa99',data:L.map(l=>a.get(l)??null)});}
      if(tmx){const a=new Map(groupAgg(months,tmx));ds.push({type:'line',label:'Tmax',yAxisID:'y1',borderColor:'#dc2626',backgroundColor:'#dc2626',tension:.25,data:L.map(l=>a.get(l)??null)});}
      if(tmn){const a=new Map(groupAgg(months,tmn));ds.push({type:'line',label:'Tmin',yAxisID:'y1',borderColor:'#0891b2',backgroundColor:'#0891b2',tension:.25,data:L.map(l=>a.get(l)??null)});}
      const o=baseOpts();o.scales.y={position:'left',title:{display:true,text:'mm',color:'#94a3b8'},ticks:{color:'#94a3b8'},grid:{color:'rgba(148,163,184,.15)'}};
      o.scales.y1={position:'right',title:{display:true,text:'°C',color:'#94a3b8'},ticks:{color:'#94a3b8'},grid:{drawOnChartArea:false}};
      mk(cv,{data:{labels:L,datasets:ds},options:o});

      const avgCols=colNames(wx).filter(n=>/^Average /.test(n)&&colType(wx,n)==='numeric');
      if(avgCols.length){
        const {c:c2,cv:cv2}=card('Weather explorer','Monthly value of any averaged weather variable');
        const sel=el('select',{onchange:draw2},...avgCols.map(n=>el('option',{value:n},n.replace('Average ',''))));
        c2.insertBefore(el('div',{class:'ctrl'},el('div',{},el('span',{},'Variable'),sel)),c2.querySelector('.chartbox'));
        g.append(c2);let ch2;
        function draw2(){
          if(ch2){ch2.destroy();charts.splice(charts.indexOf(ch2),1);}
          const m=sel.value;const agg=/Rainfall_Daily/.test(m)?'sum':'mean';
          const a=new Map(groupAgg(months,vals(wx,m,idx),agg));

function dataTable(s,idx){

    let r=idx;

    if(sortCol){const d=s.data[sortCol];r=[...r].sort((a,b)=>{const x=d[a],y=d[b];if(x==null)return 1;if(y==null)return -1;
      return (typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),undefined,{numeric:true}))*(asc?1:-1);});}
    return r;
  }
  function draw(){
    const r=rows();const pages=Math.max(1,Math.ceil(r.length/PS));page=Math.min(page,pages-1);
    const slice=r.slice(page*PS,page*PS+PS);
    wrap.innerHTML='';
    wrap.append(el('table',{},el('thead',{},el('tr',{},names.map(n=>el('th',{onclick:()=>{if(sortCol===n)asc=!asc;else{sortCol=n;asc=true;}draw();}},n+(sortCol===n?(asc?' ▲':' ▼'):''))))),
      el('tbody',{},slice.map(i=>el('tr',{},names.map(n=>el('td',{},fmt(s.data[n][i],4))))))));
    pager.innerHTML='';
    pager.append(el('button',{class:'btn',onclick:()=>{page=Math.max(0,page-1);draw();}},'‹ Prev'),
      `Page ${page+1} / ${pages} · ${r.length.toLocaleString()} rows`,
      el('button',{class:'btn',onclick:()=>{page=Math.min(pages-1,page+1);draw();}},'Next ›'));
  }
  draw();return card;
}
function download(s,r){

/* ---------- Relations: satellites vs weather / ground truth ---------- */
const DAY=86400000;
const dms=d=>d?Date.parse(String(d).slice(0,10)+'T00:00:00Z'):null;
const IDX_RE=/(NDVI|EVI|SAVI|NDMI|NDRE|GNDVI|NDWI|MSAVI|OSAVI|CI_|GVMI|MSI|PSRI|SIPI)/;
const relState={tol:7,aW:'Average Temperature_Max',aI:'NDVI_Mean',tlI:'NDVI_Mean',bI:'NDVI_Mean',bM:'Brix'};
function pearson(xs,ys){let n=0,sx=0,sy=0,sxx=0,syy=0,sxy=0;
  for(let i=0;i<xs.length;i++){const x=xs[i],y=ys[i];if(!isNum(x)||!isNum(y))continue;n++;sx+=x;sy+=y;sxx+=x*x;syy+=y*y;sxy+=x*y;}
  if(n<5)return {r:null,n};const vx=sxx-sx*sx/n,vy=syy-sy*sy/n;if(vx<=1e-12||vy<=1e-12)return {r:null,n};
  return {r:(sxy-sx*sy/n)/Math.sqrt(vx*vy),n};}
function regress(pts){const n=pts.length;if(n<3)return null;let sx=0,sy=0,sxx=0,sxy=0;pts.forEach(p=>{sx+=p.x;sy+=p.y;sxx+=p.x*p.x;sxy+=p.x*p.y;});
  const d=n*sxx-sx*sx;if(Math.abs(d)<1e-12)return null;const b=(n*sxy-sx*sy)/d,a=(sy-b*sx)/n;
  const xs=pts.map(p=>p.x),lo=Math.min(...xs),hi=Math.max(...xs);return [{x:lo,y:a+b*lo},{x:hi,y:a+b*hi}];}
const idxCols=s=>colNames(s).filter(n=>colType(s,n)==='numeric'&&IDX_RE.test(n)&&(/_Mean$/.test(n)||/^(PSRI|SIPI)$/.test(n))&&(s.cols.find(c=>c.name===n).filled>0.2));
const rlabel=n=>n.replace(/_Mean$/,'').replace(/^Average /,'').replace(/_/g,' ');
function heat(rows,cols,get,onClick){
  const t=el('table',{class:'heat'},el('thead',{},el('tr',{},el('th',{},''),cols.map(c=>el('th',{title:c,onclick:null},rlabel(c))))));
  const tb=el('tbody');
  rows.forEach(r=>{const tr=el('tr',{},el('td',{},rlabel(r)));
    cols.forEach(c=>{const {r:v,n}=get(r,c);
      const td=el('td',{class:'c',title:v==null?`not enough data (n=${n})`:`r = ${v.toFixed(3)}  ·  n = ${n}`,onclick:()=>onClick(r,c)},v==null?'–':v.toFixed(2));
      if(v!=null){const a=Math.min(1,Math.abs(v))*.85;td.style.background=v>0?`rgba(37,99,235,${a})`:`rgba(220,38,38,${a})`;if(a>.5)td.style.color='#fff';}
      else td.style.color='#94a3b8';
      tr.append(td);});
    tb.append(tr);});
  t.append(tb);return el('div',{class:'tablewrap'},t);
}

/* ---- weather relation: one satellite vs weather (joined on date) ---- */
function weatherBlock(n,st,sats,wx){
  const s=sats[st.sat],cols=idxCols(s);
  const wmap=new Map();wx.data['Weather_Date'].forEach((d,i)=>{if(d)wmap.set(dateKey(d),i);});
  const WV=colNames(wx).filter(c=>colType(wx,c)==='numeric'&&(/^Average /.test(c)||c==='Cumulative_Rainfall'));
  st.w=pickList(st.w,WV);st.i=pickList(st.i,cols);st.tl=pickList(st.tl,cols);
  const dcol=s.data['Satellite Observation_Date'],m=new Map();
  idxOf(s).forEach(i=>{const d=dateKey(dcol[i]);if(!d||!wmap.has(d))return;
    let e=m.get(d);if(!e){e={d,w:wmap.get(d),sum:{},cnt:{}};m.set(d,e);}
    cols.forEach(c=>{const v=s.data[c][i];if(isNum(v)){e.sum[c]=(e.sum[c]||0)+v;e.cnt[c]=(e.cnt[c]||0)+1;}});});
  const rows=[...m.values()].sort((a,b)=>a.d<b.d?-1:1).map(e=>({d:e.d,w:e.w,mean:Object.fromEntries(cols.map(c=>[c,e.cnt[c]?e.sum[c]/e.cnt[c]:null]))}));

    el('div',{class:'legend'},'r = −1',el('i'),'r = +1'));
  hc.append(heat(cols,WV,(i,w)=>{const p=pearson(rows.map(r=>r.mean[i]),rows.map(r=>wx.data[w][r.w]));entries.push({a:i,b:w,...p});return p;},
    (i,w)=>{st.i=i;st.w=w;draw();document.getElementById('sc-'+n).scrollIntoView({behavior:'smooth',block:'center'});}));
  const tc=el('div',{class:'card'},el('h3',{},'Strongest relationships'),el('p',{class:'sub'},'Top 6 by |r| (n ≥ 8 dates)'),topList(entries,8));

    const ds=[{type:'scatter',label:short(s.name),data:pts,backgroundColor:PAL[st.sat]+'bb',pointRadius:4}];
    const ln=regress(pts);if(ln)ds.push({type:'line',label:'Linear fit',data:ln,borderColor:PAL[st.sat],borderWidth:2,borderDash:[6,4],pointRadius:0});
    const o=scatterOpts(rlabel(st.w),rlabel(st.i));

    const L=[...dates].sort();

/* ---- ground-truth relation: one satellite vs Brix/Pol/CCS… (plot + nearest date) ---- */
function gtBlock(n,st,sats,gt){

const predState={sat:2,target:'Brix',tol:7,idx:null,wv:null,dap:false,dap2:false,lambda:1,thr:null,smooth:3,plot:null,fillPlot:null,fillDate:null,vals:{},obsDate:null,level:'plot',fillVar:null,varSel:'__all',calib:true,model:'ridge',cmp:null,mode:'both',bands:[]};
function ridgeFit(X,y,lam){
  const n=X.length,p=X[0].length;
  const mu=new Array(p).fill(0),sd=new Array(p).fill(0);
  for(let j=0;j<p;j++){let s=0;for(let r=0;r<n;r++)s+=X[r][j];mu[j]=s/n;let v=0;for(let r=0;r<n;r++)v+=(X[r][j]-mu[j])**2;sd[j]=Math.sqrt(v/n)||1;}
  const Z=X.map(r=>r.map((v,j)=>(v-mu[j])/sd[j]));
  const ym=y.reduce((a,b)=>a+b,0)/n;
  const A=Array.from({length:p},()=>new Array(p+1).fill(0));
  for(let r=0;r<n;r++)for(let i=0;i<p;i++){A[i][p]+=Z[r][i]*(y[r]-ym);for(let j=0;j<p;j++)A[i][j]+=Z[r][i]*Z[r][j];}
  for(let i=0;i<p;i++)A[i][i]+=lam;
  for(let c=0;c<p;c++){                       // gaussian elimination with partial pivoting
    let m=c;for(let r=c+1;r<p;r++)if(Math.abs(A[r][c])>Math.abs(A[m][c]))m=r;
    [A[c],A[m]]=[A[m],A[c]];const d=A[c][c]||1e-12;
    for(let j=c;j<=p;j++)A[c][j]/=d;
    for(let r=0;r<p;r++)if(r!==c){const f=A[r][c];if(f)for(let j=c;j<=p;j++)A[r][j]-=f*A[c][j];}
  }
  const mdl={mu,sd,w:A.map(r=>r[p]),b:ym};mdl.predict=x=>mdl.b+x.reduce((a,v,j)=>a+mdl.w[j]*(v-mdl.mu[j])/mdl.sd[j],0);return mdl;
}
const ridgePredict=(m,x)=>m.predict(x);

/* ---------- the 5 ML models (pure JS, no libraries) ---------- */
const MODELS={ridge:'Ridge regression (linear)',knn:'k-Nearest Neighbours',rf:'Random Forest',gb:'Gradient Boosting',krr:'Kernel Ridge (RBF, SVR-like)'};
const MODEL_INFO={
  ridge:'Linear model with L2 shrinkage — simple, stable, easy to interpret.',
  knn:'Predicts from the most similar past observations (distance-weighted average of the nearest neighbours).',
  rf:'60 randomised decision trees averaged — captures non-linear effects and interactions, robust on small data.',
  gb:'Boosted shallow trees (120 rounds, learning rate 0.08) — flexible, often the most accurate, but can overfit small data.',
  krr:'Kernel ridge with an RBF kernel (similar to a support-vector regressor) — smooth non-linear fit; capped at 150 training rows for speed.'};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function stdz(X){const n=X.length,p=X[0].length,mu=new Array(p).fill(0),sd=new Array(p).fill(1);
  for(let j=0;j<p;j++){let s=0;for(let r=0;r<n;r++)s+=X[r][j];mu[j]=s/n;let v=0;for(let r=0;r<n;r++)v+=(X[r][j]-mu[j])**2;sd[j]=Math.sqrt(v/n)||1;}
  return {mu,sd,Z:X.map(r=>r.map((v,j)=>(v-mu[j])/sd[j]))};}
function gaussSolve(A,n){                       // A is n x (n+1) augmented, solved in place
  for(let c=0;c<n;c++){let m=c;for(let r=c+1;r<n;r++)if(Math.abs(A[r][c])>Math.abs(A[m][c]))m=r;
    [A[c],A[m]]=[A[m],A[c]];const d=A[c][c]||1e-12;for(let j=c;j<=n;j++)A[c][j]/=d;
    for(let r=0;r<n;r++)if(r!==c){const f=A[r][c];if(f)for(let j=c;j<=n;j++)A[r][j]-=f*A[c][j];}}

  if(opt.mtry&&opt.mtry<p){for(let i=p-1;i>0;i--){const j=Math.floor(rng()*(i+1));[feats[i],feats[j]]=[feats[j],feats[i]];}feats=feats.slice(0,opt.mtry);}

      const sr=tot-sl,gain=sl*sl/nl+sr*sr/nr-tot*tot/n;

const treePred=(nd,x)=>{while(nd.l)nd=x[nd.f]<=nd.t?nd.l:nd.r;return nd.v;};
function fitKNN(X,y){const {mu,sd,Z}=stdz(X),k=Math.max(3,Math.min(7,Math.round(Math.sqrt(X.length)/1.8)));

    const d=Z.map((r,i)=>[r.reduce((a,v,j)=>a+(v-z[j])**2,0),i]).sort((a,b)=>a[0]-b[0]).slice(0,k);
    let w=0,s=0;for(const [dd,i] of d){const wi=1/(Math.sqrt(dd)+1e-3);w+=wi;s+=wi*y[i];}return s/w;}};}
function fitRF(X,y){const n=X.length,p=X[0].length,rng=mulberry(7),trees=[];
  const opt={maxDepth:7,minLeaf:2,mtry:Math.max(1,Math.ceil(p/2))};
  for(let t=0;t<60;t++){const idx=Array.from({length:n},()=>Math.floor(rng()*n));trees.push(buildTree(X,y,idx,0,opt,rng));}
  return {predict:x=>trees.reduce((a,tr)=>a+treePred(tr,x),0)/trees.length};}
function fitGB(X,y){const n=X.length,rng=mulberry(11),lr=0.08,M=120,F0=y.reduce((a,b)=>a+b,0)/n,F=new Array(n).fill(F0),trees=[];

        {type:'line',label:`Lab ${P.target} (variety mean)`,data:L.map(d=>lab.has(d)?lab.get(d)[0]/lab.get(d)[1]:null),showLine:false,borderColor:PAL[2],backgroundColor:PAL[2],pointRadius:6,pointStyle:'rectRot'},
        {type:'line',label:`Ripe threshold (${P.thr})`,data:L.map(()=>P.thr),borderColor:'#16a34a',borderDash:[6,4],borderWidth:2,pointRadius:0}];
      if(vr.harvest)ds.push({type:'bar',label:'Planned harvest',data:L.map(d=>d===vr.harvest?ymax:null),backgroundColor:'#dc262688',barThickness:5,order:9});
      if(rd)ds.push({type:'bar',label:'Predicted ripe date (median)',data:L.map(d=>d===rd?ymax:null),backgroundColor:'#16a34a88',barThickness:5,order:9});
    }
    if(holdV.c){holdV.c.destroy();const k=charts.indexOf(holdV.c);if(k>=0)charts.splice(k,1);}
    holdV.c=mk(cvV,{data:{labels:L,datasets:ds},options:o});
  }
  out.push(vh,vc);
  setTimeout(drawVar,0);

  /* ===== predict from user inputs: approx Brix + optimum harvest time ===== */
  const feats2=[...idxF.map(f=>({k:'idx',n:f})),...wvEff.map(f=>({k:'wx',n:f})),...(P.dap2&&hasDAP?[{k:'dap',n:'DAP'}]:[])];
  const dbc=s.data['Days Before Harvest (DBH)'];
  let model2=null,m2=null;
  if(dbc&&feats2.length){
    const r2=[];
    idxOf(s).forEach(i=>{const dap=dapc?dapc[i]:null,dbh=dbc[i];if(!isNum(dbh)||!isNum(dap)||dap<tmin-10||dap>tmax+20)return;
      const x=featRowF(i,feats2);if(x)r2.push({x,y:dbh,plot:s.data['Plot_ID'][i],month:String(dateKey(s.data['Satellite Observation_Date'][i])).slice(0,7)});});
    if(r2.length>=20){const y2=r2.map(r=>r.y);model2=fitModel(P.model,r2.map(r=>r.x),y2,lamv);m2=metricsOf(y2,cvPredict(r2,'plot',lamv));if(m2){m2.n=r2.length;m2.mae_m=(metricsOf(y2,cvPredict(r2,'month',lamv))||{}).mae;}}
  }
  const needDAP=hasDAP&&(P.dap||P.dap2);
  const inFeats=[...idxF.map(f=>({k:'idx',n:f})),...wvEff.map(f=>({k:'wx',n:f})),...(needDAP?[{k:'dap',n:'DAP'}]:[])];
  const valOf=(i,f)=>{if(f.k==='idx')return s.data[f.n][i];if(f.k==='dap')return dapc[i];const w=wmap.get(dateKey(s.data['Satellite Observation_Date'][i]));return w==null?null:wx.data[f.n][w];};
  const rng={};
  inFeats.forEach(f=>{const v=[];idxOf(s).forEach(i=>{const dap=dapc?dapc[i]:null;if(isNum(dap)&&dap>=tmin-10&&dap<=tmax+20){const q=valOf(i,f);if(isNum(q))v.push(q);}});
    rng[f.n]=v.length?[Math.min(...v),Math.max(...v)]:null;});
  /* prefill source: a plot (or a whole variety) + satellite pass */
  const lvl=P.level==='variety';
  const fillPlots=results.map(r=>r.p);
  if(!fillPlots.includes(P.fillPlot))P.fillPlot=fillPlots[0]||null;
  if(!varieties.includes(P.fillVar))P.fillVar=varieties[0]||null;
  const fillKey=lvl?P.fillVar:P.fillPlot;
  const passesOf=k=>{if(lvl){const rs=byVar.get(k)||[];return [...new Set(rs.flatMap(r=>r.cur.map(c=>c.d)))].sort();}const r=results.find(x=>x.p===k);return r?r.cur.map(c=>c.d):[];};
  const midDap=(tmin+tmax)/2;
  const dapOn=(k,d)=>{const rs=lvl?(byVar.get(k)||[]):results.filter(x=>x.p===k);const a=[];rs.forEach(r=>r.cur.forEach(c=>{if(c.d===d)a.push(c.dap);}));return mean(a);};
  if(!passesOf(fillKey).includes(P.fillDate)){const ps=passesOf(fillKey);P.fillDate=ps.length?ps.reduce((a,d)=>Math.abs(dapOn(fillKey,d)-midDap)<Math.abs(dapOn(fillKey,a)-midDap)?d:a,ps[0]):null;}
  const rowAt=(pl,d)=>{let hit=null;idxOf(s).forEach(i=>{if(hit==null&&s.data['Plot_ID'][i]===pl&&dateKey(dcol[i])===d)hit=i;});return hit;};
  const rowsAtVar=(v,d)=>{const a=[];idxOf(s).forEach(i=>{if(s.data['Variety Number']&&s.data['Variety Number'][i]===v&&dateKey(dcol[i])===d)a.push(i);});return a;};
  const pred=el('div',{class:'card span3',id:'predictor',style:'border:2px solid var(--accent)'},
    el('h3',{},'🔮 Predict from your own inputs'),
    el('p',{class:'sub'},`Enter the current satellite values${useWx?' and weather values':' (no weather needed)'} (and crop age) → approximate ${P.target} and the optimum harvest time. Pick a satellite above for the index source; values below follow your model setup.`));
  const fillPl=el('select',{onchange:e=>{if(lvl)P.fillVar=e.target.value;else P.fillPlot=e.target.value;P.fillDate=null;P.vals={};render();}},...(lvl?varieties:fillPlots).map(x=>el('option',{value:x},lvl?x:x.replace(/^KIAAR_/,''))));fillPl.value=fillKey||'';
  const fillDt=el('select',{onchange:e=>{P.fillDate=e.target.value;P.vals={};render();}},...passesOf(fillKey).map(x=>el('option',{value:x},x)));fillDt.value=P.fillDate||'';
  const lvlSel=el('select',{onchange:e=>{P.level=e.target.value;P.fillDate=null;P.vals={};render();}},el('option',{value:'plot'},'Plot-wise'),el('option',{value:'variety'},'Variety-wide'));lvlSel.value=P.level;
  pred.append(el('div',{class:'ctrl'},el('div',{},el('span',{},'Level'),lvlSel),el('div',{},el('span',{},lvl?'Start from an existing variety (optional)':'Start from an existing plot (optional)'),fillPl),el('div',{},el('span',{},'Satellite pass'),fillDt),
    el('div',{},el('span',{},' '),el('span',{class:'note'},lvl?'Variety values = average of all its plots on that pass. Overwrite any value with your own.':'…then overwrite any value with your own.'))));
  const src=lvl?null:rowAt(P.fillPlot,P.fillDate);
  const vSrc=lvl?rowsAtVar(P.fillVar,P.fillDate):[];
  const srcVal=f=>lvl?mean(vSrc.map(i=>valOf(i,f))):(src!=null?valOf(src,f):null);
  const inputs={};
  const form=el('div',{class:'ctrl',style:'align-items:start'});
  inFeats.forEach(f=>{
    const pre=srcVal(f);
    const cur=P.vals[f.n]!=null?P.vals[f.n]:(isNum(pre)?+(+pre).toFixed(4):'');
    const inp=el('input',{type:'number',step:'any',value:cur,style:'width:105px',oninput:calc});
    inputs[f.n]=inp;
    form.append(el('div',{},el('span',{},f.n==='DAP'?'Crop age (days after planting)':rlabel(f.n)),inp,el('span',{class:'note',id:'rg-'+f.n},rng[f.n]?`data range ${fmt(rng[f.n][0],3)} – ${fmt(rng[f.n][1],3)}`:'')));
  });
  const od=el('input',{type:'date',value:P.obsDate&&!P.vals._reset?P.obsDate:(P.fillDate||''),onchange:calc});
  form.append(el('div',{},el('span',{},'Observation date (for calendar harvest date)'),od));
  pred.append(form);
  if(hasDAP)pred.append(el('div',{style:'margin:6px 0'},chk('Also give crop age (days after planting) to the harvest-time model',P.dap2,on=>{P.dap2=on;P.vals={};render();}),el('span',{class:'note'},'  Off = harvest time estimated from vegetation index + weather only (more honest, wider error). On = much tighter (±2 d), but only because the trial used two planned harvest dates, so it mostly re-computes planting date + harvest age.')));
  if(lvl)pred.append(el('div',{style:'margin:6px 0'},chk('Calibrate to this variety (removes the model’s average error for it)',P.calib,on=>{P.calib=on;calc();})));
  const outBox=el('div',{class:'kpis',style:'margin:10px 0 0'});pred.append(outBox);
  const noteBox=el('p',{class:'note'});pred.append(noteBox);
  function calc(){
    const v={};inFeats.forEach(f=>{const q=parseFloat(inputs[f.n].value);v[f.n]=isNaN(q)?null:q;P.vals[f.n]=inputs[f.n].value;});
    inFeats.forEach(f=>{const e=document.getElementById('rg-'+f.n);const r=rng[f.n];if(!e||!r)return;const out=v[f.n]!=null&&(v[f.n]<r[0]||v[f.n]>r[1]);
      e.style.color=out?'#f59e0b':'';e.textContent=(out?'⚠ outside data range · ':'')+`data range ${fmt(r[0],3)} – ${fmt(r[1],3)}`;});
    P.obsDate=od.value;outBox.innerHTML='';
    const get=fl=>{const x=[];for(const f of fl){const q=v[f.n];if(q==null)return null;x.push(q);}return x;};
    const x1=get(feats);
    if(!x1){outBox.append(kpi('Approx '+P.target,'–','fill in all fields'));}
    else{
      const vs=lvl?vstat.get(P.fillVar):null;const bias=lvl&&P.calib&&vs?vs.bias/vs.n:0;
      const y1=clampY(ridgePredict(model,x1)-bias),rm=lvl&&vs?Math.sqrt(vs.se/vs.n):(mP?mP.rmse:0);
      outBox.append(kpi('Approx '+P.target+' (now)'+(lvl?' · '+P.fillVar:''),y1.toFixed(1),`likely range ${(y1-rm).toFixed(1)} – ${(y1+rm).toFixed(1)}  (±RMSE ${rm.toFixed(1)}${bias?`, calibrated ${bias>0?'−':'+'}${Math.abs(bias).toFixed(2)} for this variety`:''})`),
        kpi('Ripeness',y1>=P.thr?'Ripe ✔':'Not yet',`${P.target} ${y1.toFixed(1)} vs threshold ${P.thr}`));
    }
    const x2=model2?get(feats2):null;
    if(model2&&x2){
      let days=ridgePredict(model2,x2);days=Math.max(0,Math.min(150,days));
      const hd=od.value?new Date(Date.parse(od.value+'T00:00:00Z')+Math.round(days)*DAY).toISOString().slice(0,10):null;
      outBox.append(kpi('Optimum harvest in',Math.round(days)+' days',m2?`typical error ±${m2.mae.toFixed(0)} d for unseen plots · ±${m2.mae_m==null?'–':m2.mae_m.toFixed(0)} d for an unseen month (n=${m2.n} passes)`:''),
        kpi('Optimum harvest date',hd||'set observation date','from the observation date + predicted days'));
    } else if(!model2){outBox.append(kpi('Optimum harvest','n/a','no “Days Before Harvest” column or too few rows'));}
    else outBox.append(kpi('Optimum harvest','–','fill in all fields'));
    // reference: typical lab value near harvest
    const near=nearLab(lvl?P.fillVar:null);
    if(near.length>=3){const mu=mean(near),sd=Math.sqrt(near.reduce((a,b)=>a+(b-mu)**2,0)/near.length);
      outBox.append(kpi('Typical '+P.target+' at harvest'+(lvl?' · '+P.fillVar:''),mu.toFixed(1),`lab mean ± sd (${sd.toFixed(1)}), n=${near.length} samples taken ≤15 days before harvest`));}
    if(lvl){const vr=vrows.find(x=>x.v===P.fillVar);if(vr)outBox.append(kpi('Planned harvest · '+P.fillVar,vr.harvest||'–',`${vr.n} plots · model error on this variety ±${vr.rmse==null?'–':vr.rmse.toFixed(1)} ${P.target}`));}
    let labTxt=null;
    if(lvl){const q=[];idxOf(gt).forEach(g=>{if(gt.data['Variety Number']&&gt.data['Variety Number'][g]===P.fillVar&&P.fillDate&&Math.abs(dms(gt.data['Test_Date'][g])-dms(P.fillDate))<=P.tol*DAY&&isNum(gt.data[P.target][g]))q.push(gt.data[P.target][g]);});
      if(q.length)labTxt=`For reference, the lab measured ${P.target} averaging ${fmt(mean(q),2)} (n=${q.length} samples within ${P.tol} d of that pass) for ${P.fillVar} — comparable only while you keep the prefilled values.`;}
    else if(P.fillPlot&&P.fillDate){let bd=Infinity,lab=null;idxOf(gt).forEach(g=>{if(gt.data['Plot_ID'][g]===P.fillPlot){const d2=Math.abs(dms(gt.data['Test_Date'][g])-dms(P.fillDate));if(d2<bd&&d2<=P.tol*DAY&&isNum(gt.data[P.target][g])){bd=d2;lab={y:gt.data[P.target][g],d:gt.data['Test_Date'][g],gap:Math.round(d2/DAY)};}}});
      if(lab)labTxt=`For reference, the lab measured ${P.target} = ${fmt(lab.y,2)} on ${String(lab.d).slice(0,10)} for this plot (${lab.gap} d from the pass you started from — only valid while you keep its values unchanged).`;}
    noteBox.textContent=labTxt||'Tip: start from an existing plot or variety to compare with its lab value, then change the numbers to explore “what if”.';
  }
  out.splice(4,0,pred);
  setTimeout(calc,0);

  out.push(el('div',{class:'card span3'},el('h3',{},'Reading these results'),el('ul',{class:'top3'},
    el('li',{},'“R² · new plots” says how well the model predicts plots it has not seen; “R² · new dates” is the strict test for a new time period (it must predict from a whole unseen sampling date) and is the more honest number for forecasting.'),
    el('li',{},'Brix and crop age rise together, so vegetation-index/rainfall features partly act as a proxy for crop stage. Tick “days-after-planting” to see how much it adds.'),
    el('li',{},'Rainfall windows are identical for every plot on a given day, so flexible models (Random Forest / Boosting / kNN) can use them as a “date fingerprint”; that makes “unseen plots” results look better than they will for a genuinely new season. Compare the “unseen month” error and the strict R² column.'),
    el('li',{},'Only ~12 sampling dates exist in this dataset; treat predicted ripe dates as an estimate (± the satellite revisit interval) and refresh the model when new lab data arrives.'))));
  return [el('div',{class:'grid'},...out)];
}

/* ---------- theme toggle (Auto / Light / Dark) ---------- */
const THEMES=['auto','light','dark'];
let theme='auto';
try{theme=localStorage.getItem('dash-theme')||'auto';}catch(e){}
function applyTheme(){
  if(theme==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=theme;
  const b=document.getElementById('themeBtn');if(b)b.textContent=({auto:'◐ Auto',light:'☀ Light',dark:'☾ Dark'})[theme];
}
function cycleTheme(){theme=THEMES[(THEMES.indexOf(theme)+1)%3];try{localStorage.setItem('dash-theme',theme);}catch(e){}applyTheme();render();}
if(window.matchMedia)window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(theme==='auto')render();});

/* ---------- routing ---------- */
let current='Overview';
const hasPred=()=>S.some(s=>s.data['Satellite Observation_Date']&&s.data['NDVI_Mean'])&&S.some(s=>s.data['Brix']&&s.data['Test_Date']);
const hasRel=()=>S.some(s=>s.data['Satellite Observation_Date']&&s.data['NDVI_Mean'])&&S.some(s=>s.data['Weather_Date']||s.data['Test_Date']);
function buildTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  ['Overview',...(hasRel()?['Relations']:[]),...(hasPred()?['Prediction']:[]),...S.map(s=>s.name)].forEach(n=>t.append(el('button',{class:'tab'+(n===current?' on':''),onclick:()=>{current=n;buildTabs();render();}},(n==='Overview'||n==='Relations'||n==='Prediction')?n:short(n))));
}
function render(){
  clearCharts();root.innerHTML='';
  if(current==='Overview'){overview().forEach(n=>root.append(n));return;}
  if(current==='Relations'){relations().forEach(n=>root.append(n));return;}
  if(current==='Prediction'){prediction().forEach(n=>root.append(n));return;}
  const items=sheetView(S.find(s=>s.name===current));
  const g=el('div',{class:'grid'});
  items.forEach(n=>{ if(n.classList&&n.classList.contains('kpis'))root.append(n); else g.append(n);}); root.append(g);
}
document.getElementById('title').textContent=D.file.replace(/\.xlsx?$/i,'');
document.getElementById('meta').textContent=`Using the first ${S.length} of ${D.total_sheets} sheets: ${D.used_sheets.join(' · ')}`+(D.skipped_sheets.length?`   |   Not used: ${D.skipped_sheets.join(', ')}`:'');
applyTheme();buildFilters();buildTabs();render();
</script>
